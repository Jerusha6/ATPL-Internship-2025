<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table Generator</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        p {
            text-align: center;
        }
    </style>
</head>

<body>
    <form>
        <h2>Multiplication Table Generator</h2>
        <label>Enter a number to generate table</label>
        <input type="number" id="number" required>
        <input type="button" value="Get Table" onclick="displayTable()">
        <p id="ResultArea"></p>
    </form>
    <script>
        function displayTable() {
            const number = document.getElementById("number").value;
            const result = document.getElementById("ResultArea");
            result.innerHTML = ""; //clearing previous response
            const statement = document.createElement("h2");
            statement.textContent = "Table : " + number;
            result.appendChild(statement);
            for (let i = 1; i <= 10; i++) {
                const tableRow = document.createElement("p");
                tableRow.textContent = `${number} × ${i} = ${number * i}`;
                result.appendChild(tableRow);
            }
        }

    </script>
</body>

</html>
