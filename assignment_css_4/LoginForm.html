<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }


        .container {
            border: 1px solid rgba(179, 177, 177, 0.304);
            box-shadow: 0 2px 7px rgb(0, 0, 0, 0.1);
            height: 250px;
            width: 450px;
            border-radius: 4px;
            background-color: rgb(255, 255, 255);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        h2 {
            color: rgb(11, 108, 156);
        }

        form {
            display: flex;
            flex-direction: column;
            width: 400px;
            gap: 20px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 9px;
            border: 1.4px solid rgba(113, 113, 113, 0.169);
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: rgb(11, 108, 156);
            color: aliceblue;
            border: none;
            padding: 7px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Login</h2>
        <form action="#" method="Post">
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <input type="submit" value="Sign In">
        </form>
    </div>
</body>

</html>
