<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>

<body>
    <h2>Student Registration Form</h2><br>
    <p>Fill in this form to register</p>
<form action="/register">
<label>First Name</label>
<input type="text" required placeholder="Enter your first name">
<label>Last Name</label>
<input type="text" required placeholder="Enter your Last name">
<label>Email</label>
<input type="text" required placeholder="Enter your Email name">
<label>Date of birth</label>
<input type="date" required>
<label>Set Username</label>
<input type="text" required placeholder="Set Username">
<label>Set Password</label>
<input type="text" required placeholder="Set Password">
<label>Gender</label>
<label>Course</label>

</form>
</body>

</html>
