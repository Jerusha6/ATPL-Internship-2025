<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html MCQ</title>
</head>

<body>
    <div class="mcq">
        <h2>Please answer every question</h2> <br>
        <form action="/CssMCQ.html">
            <ol>
                <li> <label>What is HTML?</label><br>
                    <input type="radio" name="html">
                    <label> HyperText Markup Language</label><br>
                    <input type="radio" name="html">
                    <label> HyperText Machine Language</label><br>
                    <input type="radio" name="html">
                    <label> HyperText Marking Language</label><br>
                    <input type="radio" name="html">
                    <label> HighText Marking Language</label><br><br>
                </li>
                <li> <label>Which of the following colors contain equal amounts of RBG?</label><br>
                    <input type="checkbox" value="White">
                    <label> White</label><br>
                    <input type="checkbox" value="Gray">
                    <label> Gray</label><br>
                    <input type="checkbox" value="Black">
                    <label> Black</label><br>
                    <input type="checkbox" value="All of the above">
                    <label> All of the above</label><br><br>
                </li>
                <li> <label>What is the select tag used for?</label><br>
                    <input type="checkbox" value="combo">
                    <label> Creates a combo box</label><br>
                    <input type="checkbox" value="style">
                    <label> Select some attributes and change their style.</label><br>
                    <input type="checkbox" value="text">
                    <label> Change text font.</label><br>
                    <input type="checkbox" value="none">
                    <label> None of the above</label><br><br>
                </li>

                <li> <label>What is the correct syntax of doctype in HTML5?</label><br>
                    <input type="radio" value="ol" name="doc">
                    <label> &lt;/doctype html&gt;</label><br>
                    <input type="radio" value="ul" name="doc">
                    <label> &lt;doctype html&gt;</label><br>
                    <input type="radio" value="li" name="doc">
                    <label> &lt;doctype html!&gt;</label><br>
                    <input type="radio" value="dl" name="doc">
                    <label> &lt;!doctype html&gt;</label><br><br>
                </li>
                <li> <label>Which HTML tag is used to create an unordered list?</label><br>
                    <input type="radio" value="ol" name="ul">
                    <label> &lt;ol&gt;</label><br>
                    <input type="radio" value="ul" name="ul">
                    <label> &lt;ul&gt;</label><br>
                    <input type="radio" value="li" name="ul">
                    <label> &lt;li&gt;</label><br>
                    <input type="radio" value="dl" name="ul">
                    <label> &lt;dl&gt;</label><br><br>
                </li>
            </ol>
            <input type="submit" value="Next">
        </form>
    </div>
</body>

</html>
