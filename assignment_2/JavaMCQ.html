<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java MCQ</title>

</head>

<body>
    <div class="mcq">
        <h2>Please answer every question</h2> <br>
        <form action="/HtmlMCQ.html">
            <ol>
                <li> <label>What is the difference between == and .equals() when comparing objects?</label><br>
                    <input type="radio" name="op2">
                    <label> No difference</label><br>
                    <input type="radio" name="op2">
                    <label> == compares memory references, .equals() compares content</label><br>
                    <input type="radio" name="op2">
                    <label> == is faster than .equals()</label><br>
                    <input type="radio" name="op2">
                    <label> .equals() works only with strings</label><br><br>
                </li>
                <li> <label>Which statement about Java interfaces is correct?</label><br>
                    <input type="radio" name="op2">
                    <label> They can contain implemented methods only</label><br>
                    <input type="radio" name="op2">
                    <label> They can contain both default and abstract methods</label><br>
                    <input type="radio" name="op2">
                    <label> They can be instantiated</label><br>
                    <input type="radio" name="op2">
                    <label> They can contain protected methods</label><br><br>
                </li>
                <li> <label>What is the purpose of the synchronized keyword?</label><br>
                    <input type="radio" value="ol" name="op2">
                    <label>To make code run faster</label><br>
                    <input type="radio" value="ul" name="op2">
                    <label> To prevent multiple threads from accessing the same resource simultaneously</label><br>
                    <input type="radio" value="li" name="op2">
                    <label>To synchronize data with a database</label><br>
                    <input type="radio" value="dl" name="op2">
                    <label> To create synchronized collections</label><br><br>
                </li>
                <li> <label>Which collection would you use to store unique elements in sorted order?</label><br>
                    <input type="radio" value="ol" name="op2">
                    <label>ArrayList</label><br>
                    <input type="radio" value="ul" name="op2">
                    <label>TreeSet</label><br>
                    <input type="radio" value="li" name="op2">
                    <label>HashMap</label><br>
                    <input type="radio" value="dl" name="op2">
                    <label>LinkedList</label><br><br>
                </li>
                <li> <label>What is the difference between Checked and Unchecked Exceptions?</label><br>
                    <input type="radio" value="ol" name="op2">
                    <label>No difference</label><br>
                    <input type="radio" value="ul" name="op2">
                    <label>Checked exceptions must be declared or handled, unchecked don't need to be</label><br>
                    <input type="radio" value="li" name="op2">
                    <label>Unchecked exceptions are more severe</label><br>
                    <input type="radio" value="dl" name="op2">
                    <label>Checked exceptions occur at runtime only</label><br><br>
                </li>

            </ol>
            <input type="submit" value="Next">
        </form>
    </div>
</body>

</html>
