<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Visualizer</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .label {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 5px;
        }

        .box {
            width: 200px;
            margin: 30px;
            border: 8px solid #333;
            padding: 20px;
            background: lightblue;
            color: #000;
            text-align: center;
        }

        .content-box {
            box-sizing: content-box;
        }

        .border-box {
            box-sizing: border-box;
        }

        .box-wrapper {
            background: rgba(255, 0, 0, 0.1);
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="label">Content-box (width = content only)</div>
    <div class="box-wrapper">
        <div class="box content-box">Content-box model</div>
    </div>

    <div class="label">Border-box (width = content + padding + border)</div>
    <div class="box-wrapper">
        <div class="box border-box">Border-box model</div>
    </div>

</body>

</html>
