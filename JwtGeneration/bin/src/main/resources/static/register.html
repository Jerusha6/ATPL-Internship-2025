<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1b1b1b;
        }


        .container {
            border: 2px solid rgba(255, 255, 255, 0.459);
            box-shadow: 0 2px 7px rgba(255, 255, 255, 0.2);
            height: 650px;
            width: 450px;
            border-radius: 4px;
            background-color: rgb(0, 0, 0);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        h1 {
            color: rgb(6, 153, 226);
        }

        form {
            display: flex;
            flex-direction: column;
            width: 400px;
            gap: 20px;
        }

        input, select {
            background-color: rgba(240, 248, 255, 0.938);
            padding: 9px;
            border: 1.4px solid rgba(113, 113, 113, 0.169);
            border-radius: 4px;
            color: rgba(0, 0, 0, 0.582);
        }

        input[type="submit"], a {
            background-color: rgb(11, 108, 156);
            color: aliceblue;
            border: none;
            padding: 7px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
        }

        input[type="submit"]:hover, a:hover {
            box-shadow: 0 0px 9px rgb(165, 189, 201);
            border: 1px solid rgba(245, 245, 245, 0.377);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Register Form</h1>
        <form action="/registerUser" method="Post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="tel" name="mobileNumber" placeholder="Mobile Number" required>
            <input type="date" name="dob" placeholder="Date Of Birth" required>
            <select name="designation">
                <option value="Admin">Admin</option>
                <option value="Hr">HR</option>
                <option value="Network Engineer">Network Engineer</option>
                <option value="SDE I">SDE I</option>
                <option value="SDE II">SDE II</option>
                <option value="SDE III">SDE III</option>
                <option value="It Manager">It Manager</option>
                <option value="Intern">Intern</option>
            </select>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <input type="submit" value="Sign In">
            <a href="index.html">Already Signed In?</a>
        </form>
    </div>
</body>

</html>
