<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css MCQ</title>
</head>

<body>
    <div class="mcq">
        <h2>Please answer every question</h2> <br>
        <form action="/submit.html">
            <ol>
                <li> <label>What is CSS?</label><br>
                    <input type="radio" name="css">
                    <label> CSS is a style sheet language</label><br>
                    <input type="radio" name="css">
                    <label>CSS is designed to separate the presentation and content, including layout, colors, and
                        fonts</label><br>
                    <input type="radio" name="css">
                    <label>CSS is the language used to style the HTML documents</label><br>
                    <input type="radio" name="css">
                    <label>All of the mentioned</label><br><br>
                </li>
                <li> <label>Which of the following tag is used to embed css in html page?</label><br>
                    <input type="checkbox" value="css">
                    <label> &lt;css&gt;</label><br>
                    <input type="checkbox" value="doc">
                    <label> &lt;!doctype html&gt;</label><br>
                    <input type="checkbox" value="scipt">
                    <label> &lt;script&gt;</label><br>
                    <input type="checkbox" value="style">
                    <label> &lt;style&gt;</label><br><br>
                </li>
                <li> <label>Which of the following CSS selectors are used to specify a group of elements?</label><br>
                    <input type="checkbox" value="tag">
                    <label>tag</label><br>
                    <input type="checkbox" value="id">
                    <label>id</label><br>
                    <input type="checkbox" value="class">
                    <label>class</label><br>
                    <input type="checkbox" value="None of the above">
                    <label>both class and tag</label><br><br>
                </li>
                <li> <label>Which of the following has introduced text, list, box, margin, border, color, and background
                        properties?</label><br>
                    <input type="checkbox" value="HTML">
                    <label> HTML</label><br>
                    <input type="checkbox" value=" PHP">
                    <label> PHP</label><br>
                    <input type="checkbox" value=" CSS">
                    <label> CSS</label><br>
                    <input type="checkbox" value="Ajax">
                    <label>Ajax</label><br><br>
                </li>
                <li> <label> Which of the following CSS framework is used to create a responsive design?</label><br>
                    <input type="checkbox" value="django">
                    <label>django</label><br>
                    <input type="checkbox" value="rails">
                    <label>rails</label><br>
                    <input type="checkbox" value="larawell">
                    <label>larawell</label><br>
                    <input type="checkbox" value="bootstrap">
                    <label>bootstrap</label><br><br>
                </li>
            </ol>
            <input type="submit" value="Next">
        </form>
    </div>
</body>

</html>
