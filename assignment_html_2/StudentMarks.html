<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .form {
            width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #000;
        }

        table,
        td,
        th {
            border-collapse: collapse;
            padding: 10px;
            margin: 0 auto;
        }

        input[type="submit"] {
            margin-left: 45%;
        }
    </style>
</head>

<body>
    <div class="form">
        <h2>Enter Student Marks</h2>
        <form action="/submitMarks">
            <label>
                Select Student:
            </label>
            <select>
                <option value="">--Select</option>
                <option value="ATPL1001">ATPL1001 - Jerusha</option>
                <option value="ATPL1002">ATPL1002 - Harika</option>
                <option value="ATPL1003">ATPL1003 - Aditya</option>
                <option value="ATPL1004">ATPL1004 - Aditya Murali</option>
                <option value="ATPL1005">ATPL1005 - Shyam</option>
                <option value="ATPL1006">ATPL1006 - Bhargav</option>
                <option value="ATPL1007">ATPL1007 - Gnaneswar</option>
            </select><br><br>
            <div>
                <table border="1">
                    <tr>
                        <th>Subject</th>
                        <th>Marks (out of 100)</th>
                    </tr>
                    <tr>
                        <td>Maths</td>
                        <td><input type="number" min="0" max="100"></td>
                    </tr>
                    <tr>
                        <td>Science</td>
                        <td><input type="number" min="0" max="100"></td>
                    </tr>
                    <tr>
                        <td>English</td>
                        <td><input type="number" min="0" max="100"></td>
                    </tr>
                    <tr>
                        <td>History</td>
                        <td><input type="number" min="0" max="100"></td>
                    </tr>
                </table>
                <br>
                <input type="submit" value="Submit">
        </form>
    </div>
    </div>
</body>

</html>
