<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .form {
            width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #000;
        }
    </style>
</head>

<body>
    <div class="form">
        <h2>Student Registration Form</h2>
        <p>Fill in this form to register</p><br>
        <form action="/register">
            <label>First Name</label>
            <input type="text" required placeholder="Enter your first name"> <br><br>
            <label>Last Name</label>
            <input type="text" required placeholder="Enter your Last name"><br><br>
            <label>Email</label>
            <input type="text" required placeholder="Enter your Email name"><br><br>
            <label>Date of birth</label>
            <input type="date" min="2007-01-01" required><br><br>
            <label>Set Username</label>
            <input type="text" required placeholder="Set Username"><br><br>
            <label>Set Password</label>
            <input type="text" required placeholder="Set Password"><br><br>
            <label>Gender</label><br>
            <input type="radio" value="Male" name="gender" required>
            <label>Male</label><br>
            <input type="radio" value="Female" name="gender" required>
            <label>Female</label><br>
            <input type="radio" value="Others" name="gender" required>
            <label>Others</label><br><br>
            <label>Course</label>
            <select required>
                <option value="">Course</option>
                <option value="CSE - Machine Learning">CSE - Machine Learning</option>
                <option value="CSE - Deep Learning">CSE - Deep Learning</option>
                <option value="CSE - AI/ML">CSE - AI/ML</option>
            </select> <br><br>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>

</html>
