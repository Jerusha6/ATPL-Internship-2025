<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fc;
        }
        .form-container {
            max-width: 500px; 
            margin: 60px auto; 
            background: #fff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #45a049;
        }
        .btn-primary {
            width: 100%;
            background-color: #45a049; 
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Add Employee</h2>
        <form th:action="@{/employees/admin/add}" th:object="${employee}" method="post">
            
            <div class="mb-3">
                <label for="employeeName" class="form-label">Employee Name</label>
                <input type="text" th:field="*{employeeName}" class="form-control" id="employeeName" placeholder="Enter name" required>
            </div>

            <div class="mb-3">
                <label for="employeeEmail" class="form-label">Email</label>
                <input type="email" th:field="*{employeeEmail}" class="form-control" id="employeeEmail" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label for="employeeDesignation" class="form-label">Designation</label>
                <input type="text" th:field="*{employeeDesignation}" class="form-control" id="employeeDesignation" placeholder="Enter designation" required>
            </div>

            <div class="mb-3">
                <label for="contact" class="form-label">Contact</label>
                <input type="text" th:field="*{contact}" class="form-control" id="contact" placeholder="Enter contact number" required>
            </div>

            <div class="mb-3">
                <label for="employeePassword" class="form-label">Password</label>
                <input type="password" th:field="*{employeePassword}" class="form-control" id="employeePassword" placeholder="Enter password" required>
            </div>

            <div class="mb-3">
                <label for="dateOfBirth" class="form-label">Date of Birth</label>
                <input type="date" th:field="*{dateOfBirth}" class="form-control" id="dateOfBirth" required>
            </div>

            <button type="submit" class="btn btn-primary">Add Employee</button>
        </form>
        <div style="text-align: center;">
    	<a onclick="window.history.back(); return false;" class="btn btm-primary">Go back</a>
		</div>
    </div>
    
</body>
</html>
