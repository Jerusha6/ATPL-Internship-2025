<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Terminated Employees</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px;
        }

        .table-card {
            max-width: 1200px;
            margin: 0 auto 30px;
            background-color: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }

        th {
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .btn-primary {
            background-color: #c0392b;
            color: white;
        }
        
         .info-message {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #a93226;
        }

        @media (max-width: 768px) {
            .table-card {
                padding: 15px 20px;
            }

            th, td {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="table-card">
        <h2>Terminated Employees</h2>
        
         <div th:if="${terminatedEmployees.isEmpty()}" class="info-message">
        <p>No terminated employee records found for this employee.</p>
    </div>
        
        <table th:if="${!terminatedEmployees.isEmpty()}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Designation</th>
                    <th>Contact</th>
                    <th>Date of Birth</th>
                    <th>Terminated By</th>
                    <th>Terminated At</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="emp : ${terminatedEmployees}">
                    <td th:text="${emp.employeeId}"></td>
                    <td th:text="${emp.employeeName}"></td>
                    <td th:text="${emp.employeeEmail}"></td>
                    <td th:text="${emp.employeeDesignation}"></td>
                    <td th:text="${emp.contact}"></td>
                    <td th:text="${emp.dateOfBirth}"></td>
                    <td th:text="${emp.updatedBy}"></td>
                    <td th:text="${emp.updatedAt}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div style="text-align: center;">
        <a href="#" onclick="window.history.back(); return false;" class="btn btn-primary">Go Back</a>
    </div>
</body>
</html>
