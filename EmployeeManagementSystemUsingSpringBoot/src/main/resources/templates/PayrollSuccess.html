<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payroll Success</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background: #fff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #28a745;
            margin-bottom: 15px;
            font-size: 26px;
        }

        .details {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
            text-align: left;
        }

        .details p {
            margin: 8px 0;
            font-size: 16px;
            color: #333;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #007bff;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        
        .btn-primary {
            width: 100%;
            background-color: #45a049; 
        }

        .btn:hover {
            background: #0056b3;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Payroll Added Successfully</h2>

        <div class="details">
            <p><strong>Employee ID:</strong> <span th:text="${payroll.employee.employeeId}"></span></p>
            <p><strong>Base Salary:</strong> ₹<span th:text="${payroll.baseSalary}"></span></p>
            <p><strong>Bonus:</strong> ₹<span th:text="${payroll.bonus}"></span></p>
            <p><strong>Leaves:</strong> ₹<span th:text="${payroll.leaveCount}"></span></p>         
            <p><strong>Net Salary:</strong> ₹<span th:text="${payroll.netPay}"></span></p>
            <p><strong>Updated By:</strong> <span th:text="${payroll.updatedBy}"></span></p>
        </div>

        <a onclick="window.history.back(); return false;" class="btn btm-primary">Go back</a>
    </div>
</body>
</html>
