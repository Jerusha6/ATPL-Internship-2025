<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Added</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-3 text-success">Employee Added Successfully!</h2>

    <p><strong>Employee ID:</strong> <span th:text="${employee.employeeId}"></span></p>
    <p><strong>Name:</strong> <span th:text="${employee.employeeName}"></span></p>
    <p><strong>Email:</strong> <span th:text="${employee.employeeEmail}"></span></p>
    <p><strong>Designation:</strong> <span th:text="${employee.employeeDesignation}"></span></p>

    <hr>

    <h4>Would you like to add payroll for this employee?</h4>

    <form th:action="@{/employees/payroll/add}" method="get">
        <input type="hidden" name="employeeId" th:value="${employee.employeeId}"/>
        <button type="submit" class="btn btn-primary">Yes, Add Payroll</button>
    </form>

    <a href="/employees/adminView" class="btn btn-secondary mt-2">No, Go Back</a>
</div>
</body>
</html>
