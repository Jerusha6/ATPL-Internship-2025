<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .error {
            color: red;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 90%;
            margin: 0 auto 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        a.button {
            display: inline-block;
            padding: 10px 20px;
            margin: 0 auto;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
        }

        a.button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<h1>Employee Details</h1>

<div th:if="${error}" class="error">
    <p th:text="${error}"></p>
</div>

<div th:if="${employee}">
    <table>
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Designation</th>
            <th>Contact</th>
            <th>Date of Birth</th>
            <th>Created At</th>
            <th>Created By</th>
            <th>Updated At</th>
            <th>Updated By</th>
        </tr>
        <tr>
            <td th:text="${employee.employeeId}"></td>
            <td th:text="${employee.employeeName}"></td>
            <td th:text="${employee.employeeEmail}"></td>
            <td th:text="${employee.employeeDesignation}"></td>
            <td th:text="${employee.contact}"></td>
            <td th:text="${employee.dateOfBirth}"></td>
            <td th:text="${#temporals.format(employee.createdAt,'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${employee.createdBy}"></td>
            <td th:text="${#temporals.format(employee.updatedAt,'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${employee.updatedBy}"></td>
        </tr>
    </table>
</div>

<div style="text-align: center;">
    <a th:href="@{/employees/employeePayroll?(id=${employee.employeeId})}" class="button">View Payroll</a>
    <a onclick="window.history.back(); return false;" class="button">Go back</a>
</div>

</body>
</html>
