<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <link rel="stylesheet" href="slides.css">
</head>

<body>
    <div class="slider-container" id="slider">
        <div class="slides">
            <img src="images/htmlImg.png" class="slide active" alt="Image 1" />
            <img src="images/cssImg.webp" class="slide" alt="Image 2" />
            <img src="images/jsImg.png" class="slide" alt="Image 3" />
            <img src="images/com.jpeg" class="slide" alt="Image 4" />
        </div>
        <button class="prev" onclick="prevSlide()">&#10094;</button>
        <button class="next" onclick="nextSlide()">&#10095;</button>
    </div>

    <script src="slides-script.js"></script>
</body>

</html>
