<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        form {
            border: 1px solid rgba(75, 75, 75, 0.233);
            display: flex;
            border-radius: 5px;
            flex-direction: column;
            padding: 20px;
            gap: 10px;
            box-shadow: 0 4px 6px rgb(0, 0, 0, 0.4);
        }

        input,
        select {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid rgba(92, 91, 91, 0.342);
        }

        input[type="button"] {
            color: aliceblue;
            background-color: rgb(10, 110, 240);
            border: none;
            padding: 4px;
            border-radius: 3px;
            font-size: medium;
        }

        h2 {
            text-align: center;
            color: rgb(10, 110, 240);
        }
    </style>
</head>

<body>
    <form>
        <h2>Simple Calculator</h2>
        <label>Enter a number: </label>
        <input type="number" id="num1" required>
        <label>Enter another number: </label>
        <input type="number" id="num2" required>
        <label>Enter operation that you want to perform:</label>
        <select id="operation">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction(-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
            <option value="%">Modulus (%)</option>
        </select>
        <input type="button" value="Get Result" onclick="displayResult()">
        <p id="ResultArea"></p>
    </form>
    <script>
        function displayResult() {
            const num1 = parseFloat(document.getElementById("num1").value);
            const num2 = parseFloat(document.getElementById("num2").value);
            const operation = document.getElementById("operation").value;

            switch (operation) {
                case '+':
                    result = num1 + num2;
                    break;
                case '-':
                    result = num1 - num2;
                    break;
                case '*':
                    result = num1 * num2;
                    break;
                case '/':
                    result = num2 === 0 ? "cannot perform divide by zero operation" : num1 / num2;
                    break;
                case '%':
                    result = num2 === 0 ? "cannot perform modulo by zero operation" : num1 % num2;
                    break;
                default:
                    result = 'Invalid operator';
            }
            document.getElementById("ResultArea").innerText = `Result: ${result}`;
        }

    </script>
</body>

</html>
