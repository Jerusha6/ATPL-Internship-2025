<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <form>
        <h2>Simple Calculator</h2>
        <label>Enter a number: </label>
        <input type="number" id="num1" required>
        <label>Enter another number: </label>
        <input type="number" id="num2" required>
        <label>Enter operation that you want to perform:</label>
        <select id="operation">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction(-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
            <option value="%">Modulus (%)</option>
        </select>
        <input type="button" value="Get Result" onclick="displayResult()">
        <p id="ResultArea"></p>
    </form>
    <script>
        function displayResult() {
            const num1 = parseFloat(document.getElementById("num1").value);
            const num2 = parseFloat(document.getElementById("num2").value);
            const operation = document.getElementById("operation").value;

            switch (operation) {
                case '+':
                    result = num1 + num2;
                    break;
                case '-':
                    result = num1 - num2;
                    break;
                case '*':
                    result = num1 * num2;
                    break;
                case '/':
                    result = num2 === 0 ? "cannot perform divide by zero operation" : num1 / num2;
                    break;
                case '%':
                    result = num2 === 0 ? "cannot perform modulo by zero operation" : num1 % num2;
                    break;
                default:
                    result = 'Invalid operator';
            }
            document.getElementById("ResultArea").innerText = `Result: ${result}`;
        }

    </script>
</body>

</html>
