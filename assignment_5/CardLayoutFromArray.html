<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout from Array</title>
    <link rel="stylesheet" href="styles.css">

    <style>

        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .outerContainer{
            display: flex;
            flex-wrap: wrap;
            gap: 100px;
        }
        div{      
            color: aliceblue;
            width: 150px;
            text-align: center;
            border-radius: 5px;
            background-color: rgb(0, 102, 255);
            box-shadow: 0 4px 6px rgb(0,0,0, 0.4);
        }
    </style>
</head>

<body>
    <p id="ResultArea" class="outerContainer"></p>

    <script>
            const users = [
                { name: "John", age: 25 },
                { name: "Rita", age: 22 },
                { name: "Sam", age: 30 }
            ];

        for (const user of users) {
            const outerDiv = document.createElement("div");
            const name = document.createElement("p");
            name.textContent = user.name;
            const age = document.createElement("p");
            age.textContent = user.age;
            outerDiv.appendChild(name);
            outerDiv.appendChild(age);
            document.getElementById("ResultArea").appendChild(outerDiv);
        }

    </script>
</body>

</html>
