<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <form>
        <h2>Simple Grade Calculator</h2>
        <h3>Enter Subject Marks</h3>
        <label>Enter student name</label>
        <input type="text" id="name" required>
        <label>Sanskrit</label>
        <input type="number" id="Sanskrit" required>
        <label>English</label>
        <input type="number" id="English" required>
        <label>Maths</label>
        <input type="number" id="Maths" required>
        <label>Social</label>
        <input type="number" id="Social" required>
        <label>Science</label>
        <input type="number" id="Science" required>

        <input type="button" value="Get Result" onclick="displayResult()">
        <p id="ResultArea"></p>
    </form>
    <script>
        function displayResult() {
            const StudentName = document.getElementById("name").value;
            const Sanskrit = parseFloat(document.getElementById("Sanskrit").value);
            const English = parseFloat(document.getElementById("English").value);
            const Maths = parseFloat(document.getElementById("Maths").value);
            const Social = parseFloat(document.getElementById("Social").value);
            const Science = parseFloat(document.getElementById("Science").value);

            const avg = (Sanskrit + English + Maths + Social + Science) / 5;

            if (avg >= 90) {
                result = 'A - Pass';
            }
            else if (avg >= 75 && avg <= 89) {
                result = 'B - Pass';
            }
            else if (avg >= 60 && avg <= 74) {
                result = 'C - Pass';
            }
            else if (avg >= 40 && avg <= 59) {
                result = 'D - Pass';
            }
            else if (avg >= 0 && avg < 40) {
                result = 'F - Fail';
            }
            else {
                result = 'Result is Less than 0 or greater than 100';
            }

            if (result === 'F - Fail') {
                document.getElementById("ResultArea").style.color = "red";
            }
            else {
                document.getElementById("ResultArea").style.color = "green";
            }
            document.getElementById("ResultArea").innerText = `Student: ${StudentName}, Result: ${result}`;
        }

    </script>
</body>

</html>
